name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run check
      - name: Production security regressions
        run: pnpm run test:security
      - name: NEXUS regressions
        run: pnpm run test:nexus
      - name: Chart render checks
        run: pnpm run test:charts
      - name: Offline schema export
        run: pnpm run check:schema > /tmp/sahiixx-schema.sql
      - name: Build
        run: pnpm run build
      - name: Install browser for synthetic E2E
        run: pnpm exec playwright install --with-deps chromium
      - name: Desktop and mobile E2E
        run: pnpm run test:e2e

  e2e-prod:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Smoke the live Pages deploy (no secrets needed for public health/ready)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Health
        run: |
          set -e
          curl -fsS --max-time 20 https://sahiixx-os.pages.dev/api/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
      - name: Ready
        run: |
          set -e
          code=$(curl -sS -o /tmp/ready.json -w "%{http_code}" --max-time 25 https://sahiixx-os.pages.dev/api/ready)
          cat /tmp/ready.json
          test "$code" = "200"
          grep -q '"status":"ready"' /tmp/ready.json
      - name: Version
        run: |
          curl -fsS --max-time 15 https://sahiixx-os.pages.dev/api/version | tee /tmp/ver.json
          grep -q sahiixx-os /tmp/ver.json
